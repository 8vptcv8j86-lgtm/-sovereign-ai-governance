name: Generate Privacy Migration

on:
  push:
    branches:
      - feature/data-protection-governance
    paths:
      - db/schema.ts
      - drizzle.config.ts

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Verify generated 0027
        run: |
          node --input-type=module <<'NODE'
          import { readFile, readdir } from "node:fs/promises";
          const journal = JSON.parse(await readFile("drizzle/meta/_journal.json", "utf8"));
          const latest = journal.entries.at(-1);
          if (!latest || latest.idx !== 27 || !latest.tag.startsWith("0027_")) {
            throw new Error("Drizzle did not generate migration 0027");
          }
          const files = await readdir("drizzle");
          if (!files.includes(latest.tag + ".sql")) throw new Error("Generated 0027 SQL is missing");
          JSON.parse(await readFile("drizzle/meta/0027_snapshot.json", "utf8"));
          NODE
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle
          git commit -m "Generate data protection migration 0027"
          git push origin HEAD:feature/data-protection-governance
