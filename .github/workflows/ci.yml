name: Sentinel CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize script permissions
        run: chmod +x scripts/*.sh

      - name: Apply migrations to scratch SQLite database
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/sentinel-ci.db
          for migration in $(find drizzle -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "Applying $migration"
            sed 's/--> statement-breakpoint//g' "$migration" | sqlite3 /tmp/sentinel-ci.db
          done
          sqlite3 /tmp/sentinel-ci.db "PRAGMA integrity_check;" | grep -qx "ok"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test and production build
        run: npm test

      - name: Verify migration head
        run: |
          node --input-type=module <<'NODE'
          import { readFile, readdir } from "node:fs/promises";
          const journal = JSON.parse(await readFile("drizzle/meta/_journal.json", "utf8"));
          const sql = (await readdir("drizzle"))
            .filter((name) => /^\d{4}_.*\.sql$/.test(name))
            .sort();
          const latest = journal.entries.at(-1);
          if (!latest) throw new Error("Migration journal is empty");
          const expected = latest.tag + ".sql";
          if (!sql.includes(expected)) {
            throw new Error("Latest journal migration is missing: " + expected);
          }
          if (latest.idx !== 26 || !latest.tag.startsWith("0026_")) {
            throw new Error("Expected generated R2-R12 migration head 0026");
          }
          JSON.parse(await readFile("drizzle/meta/0026_snapshot.json", "utf8"));
          NODE
