name: Apply recovered Version 30 overlay

on:
  push:
    branches:
      - recovery/v30-overlay-on-v29

permissions:
  contents: write

jobs:
  overlay:
    if: ${{ !contains(github.event.head_commit.message, '[v30-overlay-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/v30-overlay-on-v29
          fetch-depth: 0
      - name: Verify recovered archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum .recovery/Sentinel-Version-30-updated-files.zip | awk '{print $1}')" = "d8a6145db38a4f4833349ca2fee6f19975a5065e8b3b03c1a2003691624e9cb2"
          unzip -z .recovery/Sentinel-Version-30-updated-files.zip | grep -F "bfa171c2ceb57b46bc22169ad91ce4fd0ea4d2c3"
      - name: Overlay exact 18 files
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          unzip -q .recovery/Sentinel-Version-30-updated-files.zip -d "$tmp"
          test "$(find "$tmp/sentinel-version-30" -type f | wc -l | tr -d ' ')" = "18"
          cp -a "$tmp/sentinel-version-30/." .
          rm -rf .recovery
          rm -f .github/workflows/v30-overlay.yml
      - name: Commit exact overlay
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sentinel-recovery-bot"
          git config user.email "sentinel-recovery-bot@users.noreply.github.com"
          git add -A
          git commit -m "Overlay recovered Version 30 update bundle [v30-overlay-applied]"
          git push origin HEAD:recovery/v30-overlay-on-v29
