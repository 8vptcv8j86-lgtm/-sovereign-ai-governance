name: Generate R2-R12 Migration

on:
  push:
    branches:
      - feature/sentinel-r2-r12-runtime
    paths:
      - db/schema.ts
      - drizzle.config.ts

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Generate Drizzle migration
        run: npm run db:generate

      - name: Verify generated 0026
        run: |
          node --input-type=module <<'NODE'
          import { readFile, readdir } from "node:fs/promises";
          const journal = JSON.parse(await readFile("drizzle/meta/_journal.json", "utf8"));
          const latest = journal.entries.at(-1);
          if (!latest || latest.idx !== 26 || !latest.tag.startsWith("0026_")) {
            throw new Error("Drizzle did not generate migration 0026");
          }
          const files = await readdir("drizzle");
          if (!files.includes(latest.tag + ".sql")) {
            throw new Error("Generated 0026 SQL is missing");
          }
          const snapshot = "drizzle/meta/0026_snapshot.json";
          JSON.parse(await readFile(snapshot, "utf8"));
          NODE

      - name: Commit generated migration
        run: |
          if git diff --quiet -- drizzle; then
            echo "No migration changes generated"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle
          git commit -m "Generate R2-R12 migration 0026"
          git push origin HEAD:feature/sentinel-r2-r12-runtime
