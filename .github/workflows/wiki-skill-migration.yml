name: WikiSkill Version 30 Verification

on:
  push:
    branches:
      - feature/wiki-skill-governance-v30

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Normalize script permissions
        run: chmod +x scripts/*.sh

      - name: Apply migrations to scratch SQLite database
        run: |
          db="$(mktemp)"
          for migration in $(find drizzle -maxdepth 1 -type f -name '*.sql' | sort); do
            sqlite3 "$db" < "$migration"
          done
          test "$(sqlite3 "$db" 'PRAGMA integrity_check;')" = "ok"

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Run regression tests
        run: node --test tests/*.test.mjs
